<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1370 625" width="1370" height="625" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Device Recall Explainer architecture</title>
<desc id="d">A question passes a scope check and memory recall, then a model drafts claims that cite SQL cells; a deterministic evaluator re-reads every cited result against Zetaris and either accepts the draft, sends the rejection reasons back for a redraft, or ends with no answer.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6F767D"/></marker></defs>
<rect width="1370" height="625" fill="#fff"/>
<rect x="470" y="165" width="430" height="335" rx="14" fill="#FDF1EF" stroke="#EE5A4A" stroke-width="1.5" stroke-dasharray="2 4"/>
<text x="482" y="494" font-size="11" font-weight="700" fill="#EE5A4A" letter-spacing="1">VERIFICATION LOOP: THE MODEL DRAFTS, CODE DECIDES</text>
<rect x="30" y="30" width="160" height="70" rx="10" fill="#FDF1EF" stroke="#EE5A4A" stroke-width="2"/>
<text x="110.0" y="61.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2B2F33">Question</text>
<text x="110.0" y="78.0" text-anchor="middle" font-size="12" font-weight="400" fill="#2B2F33">“Why did recalls rise?”</text>
<rect x="30" y="190" width="160" height="100" rx="10" fill="#F3F3F1" stroke="#2B2F33" stroke-width="2"/>
<text x="110.0" y="219.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2B2F33">Scope check · code</text>
<text x="110.0" y="236.0" text-anchor="middle" font-size="12" font-weight="400" fill="#2B2F33">recall topic only</text>
<text x="110.0" y="253.0" text-anchor="middle" font-size="12" font-weight="400" fill="#2B2F33">years 2023 and 2024</text>
<text x="110.0" y="270.0" text-anchor="middle" font-size="12" font-weight="400" fill="#2B2F33">500 characters at most</text>
<rect x="30" y="390" width="160" height="90" rx="10" fill="#fff" stroke="#EE5A4A" stroke-width="2" stroke-dasharray="6 4"/>
<text x="110.0" y="431.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#B93B2D">Refused</text>
<text x="110.0" y="448.0" text-anchor="middle" font-size="12" font-weight="400" fill="#B93B2D">no model call</text>
<rect x="260" y="190" width="160" height="100" rx="10" fill="#F3F3F1" stroke="#2B2F33" stroke-width="2"/>
<text x="340.0" y="227.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2B2F33">H-MEM recall</text>
<text x="340.0" y="244.5" text-anchor="middle" font-size="12" font-weight="400" fill="#2B2F33">hints from earlier sessions</text>
<text x="340.0" y="261.5" text-anchor="middle" font-size="12" font-weight="400" fill="#2B2F33">labelled “not evidence”</text>
<rect x="490" y="190" width="160" height="100" rx="10" fill="#EE5A4A" stroke="#B93B2D" stroke-width="2"/>
<text x="570.0" y="219.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">Drafter</text>
<text x="570.0" y="236.0" text-anchor="middle" font-size="12" font-weight="400" fill="#fff">Nemotron 3.5 Lightning</text>
<text x="570.0" y="253.0" text-anchor="middle" font-size="12" font-weight="400" fill="#fff">via Meterless Nightshift</text>
<text x="570.0" y="270.0" text-anchor="middle" font-size="12" font-weight="400" fill="#fff">every number cites a SQL cell</text>
<rect x="720" y="190" width="160" height="100" rx="10" fill="#F3F3F1" stroke="#2B2F33" stroke-width="2"/>
<text x="800.0" y="219.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2B2F33">Evaluator · code</text>
<text x="800.0" y="236.0" text-anchor="middle" font-size="12" font-weight="400" fill="#2B2F33">re-reads each cited result</text>
<text x="800.0" y="253.0" text-anchor="middle" font-size="12" font-weight="400" fill="#2B2F33">checks cell, scope,</text>
<text x="800.0" y="270.0" text-anchor="middle" font-size="12" font-weight="400" fill="#2B2F33">unclaimed numbers</text>
<rect x="950" y="190" width="160" height="100" rx="10" fill="#3A9E76" stroke="#277A58" stroke-width="2"/>
<text x="1030.0" y="227.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">Verified answer</text>
<text x="1030.0" y="244.5" text-anchor="middle" font-size="12" font-weight="400" fill="#fff">each number links</text>
<text x="1030.0" y="261.5" text-anchor="middle" font-size="12" font-weight="400" fill="#fff">to its proof</text>
<rect x="1180" y="190" width="160" height="100" rx="10" fill="#F3F3F1" stroke="#2B2F33" stroke-width="2"/>
<text x="1260.0" y="227.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2B2F33">HTML report</text>
<text x="1260.0" y="244.5" text-anchor="middle" font-size="12" font-weight="400" fill="#2B2F33">run log · receipts</text>
<text x="1260.0" y="261.5" text-anchor="middle" font-size="12" font-weight="400" fill="#2B2F33">--json for programs</text>
<rect x="490" y="390" width="160" height="90" rx="10" fill="#F3F3F1" stroke="#2B2F33" stroke-width="2"/>
<text x="570.0" y="422.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2B2F33">Research step · code</text>
<text x="570.0" y="439.5" text-anchor="middle" font-size="12" font-weight="400" fill="#2B2F33">playbook mode: fetches</text>
<text x="570.0" y="456.5" text-anchor="middle" font-size="12" font-weight="400" fill="#2B2F33">missing detail from Zetaris</text>
<rect x="720" y="390" width="160" height="90" rx="10" fill="#EE5A4A" stroke="#B93B2D" stroke-width="2"/>
<text x="800.0" y="414.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">Redraft</text>
<text x="800.0" y="431.0" text-anchor="middle" font-size="12" font-weight="400" fill="#fff">larger model, if configured</text>
<text x="800.0" y="448.0" text-anchor="middle" font-size="12" font-weight="400" fill="#fff">(Nemotron 3 Ultra)</text>
<text x="800.0" y="465.0" text-anchor="middle" font-size="12" font-weight="400" fill="#fff">sees the rejection reasons</text>
<rect x="950" y="390" width="160" height="90" rx="10" fill="#F3F3F1" stroke="#2B2F33" stroke-width="2"/>
<text x="1030.0" y="422.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2B2F33">H-MEM store</text>
<text x="1030.0" y="439.5" text-anchor="middle" font-size="12" font-weight="400" fill="#2B2F33">verified claims</text>
<text x="1030.0" y="456.5" text-anchor="middle" font-size="12" font-weight="400" fill="#2B2F33">with their SQL</text>
<rect x="490" y="30" width="390" height="70" rx="10" fill="#fff" stroke="#6F767D" stroke-width="2"/>
<text x="685.0" y="61.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2B2F33">Zetaris · real openFDA data</text>
<text x="685.0" y="78.0" text-anchor="middle" font-size="12" font-weight="400" fill="#2B2F33">guarded read-only SQL: one SELECT, openfda tables only · in-run result cache</text>
<rect x="950" y="30" width="160" height="70" rx="10" fill="#fff" stroke="#EE5A4A" stroke-width="2" stroke-dasharray="6 4"/>
<text x="1030.0" y="61.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#B93B2D">No answer</text>
<text x="1030.0" y="78.0" text-anchor="middle" font-size="12" font-weight="400" fill="#B93B2D">nothing unverified is shown</text>
<path d="M 110.0 100 L 110.0 190" fill="none" stroke="#6F767D" stroke-width="2" marker-end="url(#a)"/>
<path d="M 190 240 L 260 240" fill="none" stroke="#6F767D" stroke-width="2" marker-end="url(#a)"/>
<text x="225" y="230" text-anchor="middle" font-size="11" fill="#2B2F33" font-style="italic">in scope</text>
<path d="M 110.0 290 L 110.0 390" fill="none" stroke="#6F767D" stroke-width="2" marker-end="url(#a)"/>
<text x="118.0" y="340" text-anchor="start" font-size="11" fill="#2B2F33" font-style="italic">out of scope</text>
<path d="M 420 240 L 490 240" fill="none" stroke="#6F767D" stroke-width="2" marker-end="url(#a)"/>
<path d="M 650 240 L 720 240" fill="none" stroke="#6F767D" stroke-width="2" marker-end="url(#a)"/>
<text x="685" y="230" text-anchor="middle" font-size="11" fill="#2B2F33" font-style="italic">claims</text>
<path d="M 880 240 L 950 240" fill="none" stroke="#6F767D" stroke-width="2" marker-end="url(#a)"/>
<text x="915" y="230" text-anchor="middle" font-size="11" fill="#2B2F33" font-style="italic">all verified</text>
<path d="M 1110 240 L 1180 240" fill="none" stroke="#6F767D" stroke-width="2" marker-end="url(#a)"/>
<text x="1145" y="230" text-anchor="middle" font-size="11" fill="#2B2F33" font-style="italic">writes</text>
<path d="M 1030.0 290 L 1030.0 390" fill="none" stroke="#6F767D" stroke-width="2" marker-end="url(#a)"/>
<text x="1038.0" y="340" text-anchor="start" font-size="11" fill="#2B2F33" font-style="italic">stores</text>
<path d="M 570.0 190 L 570.0 100" fill="none" stroke="#6F767D" stroke-width="2" marker-end="url(#a)"/>
<text x="578.0" y="152" text-anchor="start" font-size="11" fill="#2B2F33" font-style="italic">SQL</text>
<path d="M 800.0 190 L 800.0 100" fill="none" stroke="#6F767D" stroke-width="2" marker-end="url(#a)"/>
<text x="792.0" y="152" text-anchor="end" font-size="11" fill="#2B2F33" font-style="italic">checks the cited cell</text>
<path d="M 862 190 L 862 145 L 1030.0 145 L 1030.0 100" fill="none" stroke="#6F767D" stroke-width="2" marker-end="url(#a)"/>
<text x="935" y="138" text-anchor="start" font-size="11" fill="#2B2F33" font-style="italic">rounds or time used up</text>
<path d="M 745 290 L 745 335 L 570.0 335 L 570.0 390" fill="none" stroke="#6F767D" stroke-width="2" marker-end="url(#a)"/>
<text x="578.0" y="327" text-anchor="start" font-size="11" fill="#2B2F33" font-style="italic">missing_evidence (playbook mode)</text>
<path d="M 790 290 L 790 390" fill="none" stroke="#6F767D" stroke-width="2" marker-end="url(#a)"/>
<text x="798" y="330" text-anchor="start" font-size="11" fill="#2B2F33" font-style="italic">rejected,</text>
<text x="798" y="343" text-anchor="start" font-size="11" fill="#2B2F33" font-style="italic">with reasons</text>
<path d="M 868 390 L 868 290" fill="none" stroke="#6F767D" stroke-width="2" marker-end="url(#a)"/>
<text x="876" y="330" text-anchor="start" font-size="11" fill="#2B2F33" font-style="italic">checked</text>
<text x="876" y="343" text-anchor="start" font-size="11" fill="#2B2F33" font-style="italic">again</text>
<path d="M 650 435 L 720 435" fill="none" stroke="#6F767D" stroke-width="2" marker-end="url(#a)"/>
<text x="685" y="426" text-anchor="middle" font-size="11" fill="#2B2F33" font-style="italic">more facts</text>
<rect x="30" y="545" width="22" height="16" rx="4" fill="#EE5A4A" stroke="#B93B2D" stroke-width="2"/>
<text x="60" y="558" font-size="12.5" fill="#2B2F33">model call</text>
<rect x="205" y="545" width="22" height="16" rx="4" fill="#F3F3F1" stroke="#2B2F33" stroke-width="2"/>
<text x="235" y="558" font-size="12.5" fill="#2B2F33">plain code</text>
<rect x="380" y="545" width="22" height="16" rx="4" fill="#3A9E76" stroke="#277A58" stroke-width="2"/>
<text x="410" y="558" font-size="12.5" fill="#2B2F33">verified output</text>
<text x="30" y="587" font-size="12.5" fill="#2B2F33">The model never checks itself: the evaluator is code.</text>
<text x="30" y="606" font-size="12.5" fill="#2B2F33">Playbook mode: code runs the fixed queries and the model explains numbered facts. Exploratory mode: the model writes its own SQL.</text>
</svg>
